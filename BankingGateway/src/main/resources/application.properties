spring.application.name=BankingGateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=auth-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://BANKINGAUTH
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=bank-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://BANKINGAUTH
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/bank/**